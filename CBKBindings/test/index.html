<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CBKBindings WASM Test</title>
  <style>
    body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 1rem 2rem; }
    h2   { color: #9cdcfe; }
    h3   { color: #4ec9b0; margin-top: 1.5rem; }
    .pass  { color: #4caf50; }
    .fail  { color: #f44336; }
    .info  { color: #ce9178; }
    .json  { color: #dcdcaa; white-space: pre-wrap; font-size: 0.85em; }
    pre    { background: #252526; padding: 0.5rem 1rem; border-radius: 4px; }
    #log   { max-width: 900px; }
    #canvas { border: 1px solid #444; background: #000; display: block; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h2>CBKBindings WASM Test</h2>
  <canvas id="canvas" width="1280" height="720" tabindex="-1"></canvas>
  <div id="log"></div>

  <script type="module">
    import CabrankEngine from '../bin/wasm/CBKBindings.js';

    const canvas = document.getElementById('canvas');
    const logEl = document.getElementById('log');

    // Stop right-click context menu so the engine can capture mouse buttons.
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    function section(title) {
      const h = document.createElement('h3');
      h.textContent = title;
      logEl.appendChild(h);
    }

    function log(label, value, ok = null) {
      const pre = document.createElement('pre');
      let cls = ok === null ? 'info' : ok ? 'pass' : 'fail';
      let display = value === undefined ? '' : (typeof value === 'object' ? JSON.stringify(value, null, 2) : String(value));
      pre.innerHTML = `<span class="${cls}">${label}</span>${display ? ': <span class="json">' + display + '</span>' : ''}`;
      logEl.appendChild(pre);
      console.log(label, value ?? '');
    }

    function assert(label, condition, got) {
      log(condition ? `✓ ${label}` : `✗ ${label}`, got, condition);
    }

    // Models and textures are not embedded in the wasm (would balloon it past
    // browser-friendly sizes). They live on disk and are fetched into MEMFS at
    // runtime — the editor will do the same flow with files the user uploads.
    //
    // Server setup: serve the project root (e.g. `python3 -m http.server` from
    // /home/cabranca/dev/game-dev) and open /CBKBindings/test/index.html.
    const ASSETS_BASE = new URL('../../Sandbox/assets/', import.meta.url);

    async function uploadIntoMemfs(m, relativePath) {
      const url = new URL(relativePath, ASSETS_BASE);
      const res = await fetch(url);
      if (!res.ok) throw new Error(`fetch ${url}: ${res.status}`);
      const bytes = new Uint8Array(await res.arrayBuffer());
      const memfsPath = '/assets/' + relativePath;
      const dir = memfsPath.substring(0, memfsPath.lastIndexOf('/'));
      m.FS.mkdirTree(dir);
      m.FS.writeFile(memfsPath, bytes);
      return { memfsPath, bytes: bytes.length };
    }

    CabrankEngine({
      canvas,
      print:    (text) => console.log('[wasm]', text),
      printErr: (text) => console.error('[wasm]', text),
    }).then(async m => {
      log('Module loaded — Application is running, main loop ticking', undefined, true);

      section('Upload backpack assets into MEMFS');
      try {
        for (const f of ['models/backpack/backpack.cbkm',
                         'models/backpack/diffuse.cbkt',
                         'models/backpack/specular.cbkt']) {
          const r = await uploadIntoMemfs(m, f);
          log('uploaded', `${r.memfsPath} (${r.bytes} bytes)`, true);
        }
      } catch (e) {
        log('upload failed', String(e), false);
        return;
      }

      // -----------------------------------------------------------------------
      // Build a tiny scene that should be visible: camera + cube + light.
      // CTransform/CCamera + CCameraController + CDirectionalLight + CPhongModel.
      // -----------------------------------------------------------------------
      section('Build a visible scene');

      m.sceneNew('LiveScene');

      const camId = m.entityCreate('MainCamera');
      m.addTransform(camId, JSON.stringify({ position: [0, 1, 5], rotation: [0, 0, 0], scale: [1, 1, 1] }));
      // fov_y is in *radians* (engine convention; default is PI/4 in CCamera).
      m.addCamera(camId, JSON.stringify({
        type: 'perspective', is_active: true, fov_y: Math.PI / 3, near: 0.1, far: 1000.0, ortho_size: 10.0,
      }));
      m.addCameraController(camId, JSON.stringify({
        translation_speed: 5.0, mouse_sensitivity: 0.3, yaw: -90.0, pitch: 0.0,
      }));
      log('camera created', camId, true);

      const lightId = m.entityCreate('Sun');
      m.addDirectionalLight(lightId, JSON.stringify({
        direction: [-0.5, -1.0, -0.3],
        radiance:  [ 1.0,  0.95,  0.9],
      }));
      log('directional light created', lightId, true);

      // Backpack — Phong model resolved through MEMFS upload above.
      const backpackId = m.entityCreate('Backpack');
      m.addTransform(backpackId, JSON.stringify({ position: [0, 0, 0], rotation: [0, 0, 0], scale: [1, 1, 1] }));
      m.addPhongModel(backpackId, JSON.stringify({ path: 'assets/models/backpack/backpack.cbkm' }));
      log('phong model created', backpackId, true);

      log('serialized scene', JSON.parse(m.serializeScene()));

    }).catch(err => {
      log('Failed to load module', String(err), false);
      console.error(err);
    });
  </script>
</body>
</html>
