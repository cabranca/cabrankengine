<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CBKBindings WASM Test</title>
  <style>
    body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 1rem 2rem; }
    h2   { color: #9cdcfe; }
    h3   { color: #4ec9b0; margin-top: 1.5rem; }
    .pass  { color: #4caf50; }
    .fail  { color: #f44336; }
    .info  { color: #ce9178; }
    .json  { color: #dcdcaa; white-space: pre-wrap; font-size: 0.85em; }
    pre    { background: #252526; padding: 0.5rem 1rem; border-radius: 4px; }
    #log   { max-width: 900px; }
  </style>
</head>
<body>
  <h2>CBKBindings WASM Test</h2>
  <div id="log"></div>

  <script type="module">
    import CabrankEngine from '../bin/wasm/CBKBindings.js';

    const logEl = document.getElementById('log');

    function section(title) {
      const h = document.createElement('h3');
      h.textContent = title;
      logEl.appendChild(h);
    }

    function log(label, value, ok = null) {
      const pre = document.createElement('pre');
      let cls = ok === null ? 'info' : ok ? 'pass' : 'fail';
      let display = value === undefined ? '' : (typeof value === 'object' ? JSON.stringify(value, null, 2) : String(value));
      pre.innerHTML = `<span class="${cls}">${label}</span>${display ? ': <span class="json">' + display + '</span>' : ''}`;
      logEl.appendChild(pre);
      console.log(label, value ?? '');
    }

    function assert(label, condition, got) {
      log(condition ? `✓ ${label}` : `✗ ${label}`, got, condition);
    }

    CabrankEngine().then(m => {
      log('Module loaded', undefined, true);

      // -----------------------------------------------------------------------
      // Scene
      // -----------------------------------------------------------------------
      section('Scene — sceneNew / serializeScene');

      m.sceneNew('TestScene');
      const emptyJson = JSON.parse(m.serializeScene());
      assert('serializeScene returns valid JSON', typeof emptyJson === 'object', emptyJson);
      assert('scene name is TestScene', emptyJson.metadata?.name === 'TestScene', emptyJson.metadata?.name);
      assert('entities array is empty', Array.isArray(emptyJson.entities) && emptyJson.entities.length === 0, emptyJson.entities);

      // -----------------------------------------------------------------------
      // Entities
      // -----------------------------------------------------------------------
      section('Entities — entityCreate / getAllEntities / entityDestroy');

      const camId  = m.entityCreate('MainCamera');
      const lightId = m.entityCreate('SunLight');
      assert('entityCreate returns numeric id (camera)', Number.isInteger(camId), camId);
      assert('entityCreate returns numeric id (light)', Number.isInteger(lightId), lightId);
      assert('ids are different', camId !== lightId, `${camId} vs ${lightId}`);

      const allJson = JSON.parse(m.getAllEntities());
      assert('getAllEntities has 2 entities', allJson.entities?.length === 2, allJson.entities?.length);

      // -----------------------------------------------------------------------
      // CTransform — add / get / set / remove
      // -----------------------------------------------------------------------
      section('CTransform — add / get / set / remove');

      const tfAdd = m.addTransform(camId, JSON.stringify({
        position: [0, 2, 10],
        rotation: [0, 0, 0],
        scale:    [1, 1, 1],
      }));
      assert('addTransform returns true', tfAdd === true, tfAdd);

      const tfGet = JSON.parse(m.getTransform(camId));
      assert('getTransform position[2] == 10', tfGet.position?.[2] === 10, tfGet);

      const tfSet = m.setTransform(camId, JSON.stringify({
        position: [5, 0, 0],
        rotation: [0, 90, 0],
        scale:    [2, 2, 2],
      }));
      assert('setTransform returns true', tfSet === true, tfSet);

      const tfGet2 = JSON.parse(m.getTransform(camId));
      assert('getTransform position[0] == 5 after set', tfGet2.position?.[0] === 5, tfGet2.position?.[0]);
      assert('getTransform scale[0] == 2 after set',    tfGet2.scale?.[0] === 2,    tfGet2.scale?.[0]);

      m.removeTransform(camId);
      const tfAfterRemove = m.getTransform(camId);
      assert('getTransform returns "" after remove', tfAfterRemove === '', tfAfterRemove);

      // -----------------------------------------------------------------------
      // CCamera
      // -----------------------------------------------------------------------
      section('CCamera — add / get / set');

      const camAdd = m.addCamera(camId, JSON.stringify({
        type: 'perspective', is_active: true, fov_y: 45.0, near: 0.1, far: 1000.0, ortho_size: 10.0,
      }));
      assert('addCamera returns true', camAdd === true, camAdd);

      const camGet = JSON.parse(m.getCamera(camId));
      assert('getCamera fov_y == 45', camGet.fov_y === 45, camGet.fov_y);
      assert('getCamera is_active == true', camGet.is_active === true, camGet.is_active);

      const camSet = m.setCamera(camId, JSON.stringify({
        type: 'perspective', is_active: false, fov_y: 60.0, near: 0.1, far: 500.0, ortho_size: 10.0,
      }));
      assert('setCamera returns true', camSet === true, camSet);
      assert('getCamera fov_y == 60 after set', JSON.parse(m.getCamera(camId)).fov_y === 60, JSON.parse(m.getCamera(camId)).fov_y);

      // -----------------------------------------------------------------------
      // CCameraController
      // -----------------------------------------------------------------------
      section('CCameraController — add / get / set');

      const ccAdd = m.addCameraController(camId, JSON.stringify({
        translation_speed: 5.0, mouse_sensitivity: 0.3, yaw: -90.0, pitch: 0.0,
      }));
      assert('addCameraController returns true', ccAdd === true, ccAdd);

      const ccGet = JSON.parse(m.getCameraController(camId));
      assert('getCameraController yaw == -90', ccGet.yaw === -90, ccGet.yaw);
      assert('getCameraController mouse_sensitivity == 0.3', Math.abs(ccGet.mouse_sensitivity - 0.3) < 1e-5, ccGet.mouse_sensitivity);

      // -----------------------------------------------------------------------
      // CDirectionalLight
      // -----------------------------------------------------------------------
      section('CDirectionalLight — add / get / set');

      const dlAdd = m.addDirectionalLight(lightId, JSON.stringify({
        direction: [-0.5, -1.0, -0.5],
        radiance:  [ 1.0,  0.95,  0.9],
      }));
      assert('addDirectionalLight returns true', dlAdd === true, dlAdd);

      const dlGet = JSON.parse(m.getDirectionalLight(lightId));
      assert('getDirectionalLight direction[1] == -1', dlGet.direction?.[1] === -1, dlGet.direction?.[1]);

      m.setDirectionalLight(lightId, JSON.stringify({
        direction: [0, -1, 0],
        radiance:  [1,  1, 1],
      }));
      assert('getDirectionalLight direction[0] == 0 after set', JSON.parse(m.getDirectionalLight(lightId)).direction?.[0] === 0, JSON.parse(m.getDirectionalLight(lightId)).direction?.[0]);

      // -----------------------------------------------------------------------
      // CPointLight
      // -----------------------------------------------------------------------
      section('CPointLight — add / get');

      const plAdd = m.addPointLight(lightId, JSON.stringify({
        radiance: [1.0, 0.8, 0.6],
        constant: 1.0, linear: 0.09, quadratic: 0.032,
      }));
      assert('addPointLight returns true', plAdd === true, plAdd);

      const plGet = JSON.parse(m.getPointLight(lightId));
      assert('getPointLight linear == 0.09', Math.abs(plGet.linear - 0.09) < 1e-5, plGet.linear);

      // -----------------------------------------------------------------------
      // CText
      // -----------------------------------------------------------------------
      section('CText — add / get');

      const txtId = m.entityCreate('Label');
      const txtAdd = m.addText(txtId, JSON.stringify({
        text: 'Hello, CBK!', font_scale: 1.0, color: [1, 1, 1, 1],
      }));
      assert('addText returns true', txtAdd === true, txtAdd);

      const txtGet = JSON.parse(m.getText(txtId));
      assert('getText text == "Hello, CBK!"', txtGet.text === 'Hello, CBK!', txtGet.text);

      // -----------------------------------------------------------------------
      // Error / edge cases
      // -----------------------------------------------------------------------
      section('Edge cases');

      const missingGet = m.getCamera(9999);
      assert('getCamera on unknown entity returns ""', missingGet === '', missingGet);

      const setMissing = m.setCamera(9999, JSON.stringify({
        type: 'perspective', is_active: true, fov_y: 45, near: 0.1, far: 1000, ortho_size: 10,
      }));
      assert('setCamera on unknown entity returns false', setMissing === false, setMissing);

      const badJson = m.addTransform(camId, '{ not valid json }');
      assert('addTransform with bad JSON returns false', badJson === false, badJson);

      // -----------------------------------------------------------------------
      // Serialize full scene
      // -----------------------------------------------------------------------
      section('Full scene round-trip — serializeScene / deserializeScene');

      const fullJson = m.serializeScene();
      log('serializeScene output', JSON.parse(fullJson));

      m.deserializeScene(fullJson);
      const reJson = m.serializeScene();
      assert('re-serialized scene matches original', fullJson === reJson, fullJson === reJson ? '(match)' : `orig len=${fullJson.length} re len=${reJson.length}`);

      // -----------------------------------------------------------------------
      // entityDestroy
      // -----------------------------------------------------------------------
      section('entityDestroy');

      m.entityDestroy(lightId);
      const afterDestroy = JSON.parse(m.getAllEntities());
      assert('entity count is 2 after destroy (camera + label)', afterDestroy.entities?.length === 2, afterDestroy.entities?.length);

    }).catch(err => {
      log('Failed to load module', String(err), false);
      console.error(err);
    });
  </script>
</body>
</html>
